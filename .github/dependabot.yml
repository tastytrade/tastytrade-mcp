# Dependabot — automated dependency updates.
#
# WHY THIS EXISTS. This tree once carried a pile of open advisories with nothing
# watching it. `./build.sh` stage 7 now fails the build on any HIGH or CRITICAL
# advisory, so the problem cannot ship — but a gate only speaks when somebody
# runs it. Dependabot is what turns "we would have found out eventually" into a
# pull request that arrives on its own.
#
# A Dependabot pull request can go green here without help: ci.yml triggers on
# `pull_request` with no branch filter, so the branch gets the full eight-stage
# gate, and no stage of that gate needs a secret. A bump that clears an advisory
# therefore arrives already proven.
#
# REVIEWERS ARE DELIBERATELY NOT LISTED. Dependabot's pull requests are ordinary
# pull requests, so .github/CODEOWNERS assigns them like any other change. One
# place to edit when ownership moves is the point of CODEOWNERS.
#
# `docker` IS DELIBERATELY NOT WATCHED. The Dockerfile reaches its base image
# through a build argument (`ARG NODE_IMAGE=node:22-alpine`, then
# `FROM ${NODE_IMAGE}`), and Dependabot cannot rewrite a templated `FROM` line.
# A `package-ecosystem: docker` entry would look like coverage while updating
# nothing at all, which is worse than the honest gap: bump the base image by
# hand, or pin it literally in the Dockerfile first and then add the entry.
version: 2
updates:
  # --- npm ------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Leave the caret ranges in package.json alone unless a fix genuinely needs
    # a higher floor. Most updates then land as a lockfile-only diff, which is
    # the smallest thing a reviewer can be handed.
    versioning-strategy: increase-if-necessary
    # Two dev dependencies are held below their latest major on purpose, for two
    # different reasons. A typescript major cannot install at all: npm exits
    # ERESOLVE before a single test runs, so the whole group goes red for a
    # reason unrelated to its other members. An @types/node major installs and
    # passes the gate; it is held for correctness, not installability.
    #
    # typescript: ts-jest@29.4.5, the version this tree installs, declares
    # `typescript: >=4.3 <6`. typescript-eslint declares `>=4.8.4 <6.1.0`.
    # ts-jest's bound is the tighter one and therefore the binding one, so a
    # TypeScript 6 major fails on ts-jest, not on typescript-eslint — note
    # `<6.1.0` would itself admit 6.0.x. Revisit when TS-JEST widens its peer
    # range; ts-jest 29.4.12 already declares `>=4.3 <7`, so bumping ts-jest is
    # the first move, and typescript-eslint will need checking at the same time.
    #
    # @types/node: this should track the Node major the server actually supports
    # (.node-version and engines both say 22), not the newest published types.
    # Types ahead of the runtime typecheck against APIs that are not there.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # `include: scope` is what appends the `(deps)` / `(deps-dev)` scope, so the
    # prefix must NOT contain one: `prefix: chore(deps)` here would produce
    # "chore(deps)(deps): bump ...". As written this yields
    # "chore(deps): bump axios ..." and "chore(deps-dev): bump jest ...",
    # matching the convention already in this repository's history.
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The toolchain (typescript, eslint, prettier, jest, ts-jest, the @types
      # packages) is most of the dependency list and moves constantly. Batched,
      # it is one weekly decision that the gate either passes or does not.
      # Unbatched it is ten pull requests a week, and a flood nobody reads is
      # the failure mode that ends with Dependabot switched off.
      #
      # `applies-to: version-updates` is stated explicitly because it is the
      # important half: grouping never applies to a SECURITY update, so a fix
      # for an advisory still arrives as its own small pull request that can be
      # reviewed and merged on its own.
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
      # No group for the two runtime dependencies (@modelcontextprotocol/sdk and
      # axios). Those are the ones that ship inside the container image and sit
      # on the money-moving path, so each one gets its own pull request and its
      # own read.

  # --- GitHub Actions -------------------------------------------------------
  #
  # The ecosystem people forget. Every workflow pins each action to a COMMIT
  # DIGEST with the version in a trailing comment
  # (actions/checkout@3d3c42e… # v7.0.1), and those pins go stale exactly like
  # an npm range does — except a stale action is an unreviewed supply-chain
  # input with write-shaped permissions available to it, not just a library.
  #
  # Dependabot understands digest pins: it rewrites the SHA and the trailing
  # version comment together, which is the whole reason the digest rule is
  # affordable. Do not "simplify" any `uses:` back to a major tag — release.yml
  # explains why, and the tag is mutable by whoever owns the action's
  # repository.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Three workflows sharing largely the same actions: one pull request.
      actions:
        applies-to: version-updates
        patterns:
          - "*"
